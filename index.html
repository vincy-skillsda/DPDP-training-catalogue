<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DPDP Awareness Training & Certification | SkillsDA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cover">
    <header class="brand-row">
      <div class="skillsda-panel">
        <!-- Original SkillsDA trademark artwork. Do not recolour, crop or recreate. -->
        <img src="images/skillsda-logo-original.png" alt="SkillsDA - Center for advance training">
      </div>
      <div class="brand-divider" aria-hidden="true"></div>
      <div class="nielit-panel">
        <!-- Original NIELIT artwork with designation kept together. -->
        <img src="images/nielit-logo-original.jpg" alt="NIELIT - An Autonomous Scientific Society of Ministry of Electronics and IT (MeitY), Government of India">
      </div>
      <div class="edition">
        <span>PROGRAMME</span>
        <span>CATALOGUE</span>
        <strong>2026</strong>
      </div>
    </header>

    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">SKILLSDA • NIELIT</p>
        <h1>DPDP<br><span class="regular">Awareness</span><br><span class="regular">Training &</span><br><span class="lime">Certification</span></h1>
      </div>
      <div class="privacy-wheel" aria-label="Data privacy and cybersecurity illustration">
        <div class="wheel-ring"></div>
        <div class="orbit"></div>
        <div class="shield">
          <svg viewBox="0 0 120 140" role="img" aria-label="Shield and lock">
            <path d="M60 7 L105 27 V67 C105 99 85 120 60 133 C35 120 15 99 15 67 V27 Z" fill="none" stroke="#f7fbff" stroke-width="6" stroke-linejoin="round"/>
            <rect x="42" y="62" width="36" height="31" rx="6" fill="none" stroke="#f7fbff" stroke-width="5"/>
            <path d="M49 62 V49 C49 34 71 34 71 49 V62" fill="none" stroke="#f7fbff" stroke-width="5"/>
            <circle cx="60" cy="76" r="4" fill="#a5ff20"/>
            <path d="M60 80 V86" stroke="#a5ff20" stroke-width="4" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="orbit-icon people">♙</div>
        <div class="orbit-icon database">▤</div>
        <div class="orbit-icon device">▱</div>
        <div class="orbit-icon settings">⚙</div>
        <div class="orbit-icon document">▧</div>
        <div class="orbit-icon cloud">☁</div>
      </div>
    </section>

    <section class="law-banner">
      <div class="gavel" aria-hidden="true">⚖</div>
      <div class="law-divider"></div>
      <div class="law-text">DPDP ACT, 2023 &amp;<br><strong>DPDP RULES, 2025</strong></div>
    </section>

    <section class="stats" aria-label="Programme coverage">
      <div class="stat"><strong>9</strong><span>SECTORS</span></div>
      <div class="stat"><strong>74</strong><span>SUB-SECTORS</span></div>
      <div class="stat"><strong>1,089</strong><span>ROLE<br>COMBINATIONS</span></div>
      <div class="stat"><strong>23</strong><span>LANGUAGES</span></div>
    </section>

    <section class="message">
      <div class="rule"></div>
      <p>ONE LAW.</p>
      <p>DIFFERENT RESPONSIBILITIES.</p>
      <strong>PERSONALISED LEARNING.</strong>
    </section>

    <div class="bottom-wave" aria-hidden="true">
      <svg viewBox="0 0 1055 170" preserveAspectRatio="none">
        <path d="M0 35 C230 150 470 155 720 93 C850 60 950 10 1055 0 L1055 170 L0 170 Z" fill="#0067c8" opacity=".55"/>
        <path d="M0 45 C240 145 500 140 760 75 C900 40 970 20 1055 18" fill="none" stroke="#00c8e8" stroke-width="8"/>
        <path d="M520 140 C720 95 890 25 1055 0" fill="none" stroke="#a5ff20" stroke-width="7"/>
      </svg>
    </div>
  </main>
</body>
</html>
